name: Build and Deploy

on:
    push:
        branches:
        - main
    pull_request:
        branches:
        - main

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            sha_tag: ${{ steps.tag.outputs.sha_tag }}
        steps:
        -   name: Checkout code
            uses: actions/checkout@v6

        -   name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4

        -   name: Log in to DockerHub
            uses: docker/login-action@v4
            with:
                username: ${{ secrets.DOCKERHUB_USERNAME}}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

        -   name: Determine SHA tag
            id: tag
            run: echo "sha_tag=${GITHUB_SHA::5}" >> $GITHUB_OUTPUT
            
        -   name: Build and push Docker images
            id: build
            uses: docker/build-push-action@v7
            with:
                context: ./
                file: ./Dockerfile
                push: ${{ github.event_name == 'push' }}
                load: ${{ github.event_name != 'push' }}
                tags: |
                    ifeoluwashola/verbatim-transcribe:${{ steps.tag.outputs.sha_tag }}
    deploy:
        needs: build
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout code
            uses: actions/checkout@v6
    
        -   name: SSH and Update
            uses: appleboy/ssh-action@v1.0.3
            with:
                host: ${{ secrets.EC2_HOST }}
                username: ubuntu
                key: ${{ secrets.SSH_PRIVATE_KEY }}
                script: |
                    # Authenticate with DockerHub
                    echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
                    
                    # Pull latest image
                    docker pull ifeoluwashola/verbatim-transcribe:${{ needs.build.outputs.sha_tag }}
                    export IMAGE=ifeoluwashola/verbatim-transcribe:${{ needs.build.outputs.sha_tag }}

                    docker run -d -p 8000:8000 --name verbatim-transcribe $IMAGE
